<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Hub - Properties</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Real Estate Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="properties.html" class="active">Properties</a></li>
                <li><a href="agents.html">Agents</a></li>
                <li><a href="add-property.html">Add Property</a></li>
                <li><a href="property-listings.html">Property Listings</a></li>
            </ul>

        </nav>
    </header>
    <main>
        <section class="property-search">
            <h2>Search Properties</h2>
            <form id="searchForm">
                <div>
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Nairobi">
                </div>
                <div>
                    <label for="type">Property Type:</label>
                    <select id="type" name="type">
                        <option value="">Any</option>
                        <option value="house">House</option>
                        <option value="apartment">Apartment</option>
                        <option value="land">Land</option>
                        <option value="commercial">Commercial</option>
                    </select>
                </div>
                <button type="submit">Search</button>
            </form>
        </section>
        <section class="property-listings">
            <h3>Available Properties</h3>
            <div id="propertyList">
                <p>Loading properties...</p>
            </div>
            <p>
                <a href="https://www.google.com/imgres?q=estate%20pics&imgurl=https%3A%2F%2Fmedia.gettyimages.com%2Fid%2F1281180946%2Fphoto%2Fbeautiful-luxury-home.jpg%3Fs%3D612x612%26w%3Dgi%26k%3D20%26c%3DPRNZglAefiIZXV_JLBs90KxIN8892dvl0csH2ZoqhrE%3D&imgrefurl=https%3A%2F%2Fwww.gettyimages.com%2Fphotos%2Flarge-estate&docid=NUi6MALRVvXaXM&tbnid=Et90iAQT_mKdJM&vet=12ahUKEwit_52qmISNAxV1U6QEHapsDVwQM3oECBgQAA..i&w=612&h=409&hcb=2&ved=2ahUKEwit_52qmISNAxV1U6QEHapsDVwQM3oECBgQAA" target="_blank">
                    View Image of a Beautiful Luxury Home
                  </a>
            </p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Real Estate Hub</p>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
